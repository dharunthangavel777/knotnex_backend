steps:
  # 1. Build and push container to Artifact Registry using docker + docker-credential-gcr
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker-credential-gcr configure-docker --registries=asia-south1-docker.pkg.dev
        docker build -t asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest .
        docker push asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest

  # 2. Deploy to Cloud Run (Low-Cost Spec: 0-5 instances, 1 vCPU, 1GiB)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'knotnex-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--service-account=knotnex-cloudrun-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:asia-south1:knotnex-db'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--concurrency=40'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--set-env-vars=NODE_ENV=production,APP_ENV=production,GCS_PROJECT_ID=$PROJECT_ID,GCS_MEDIA_BUCKET=knotnex-media-prod,GCS_PRIVATE_BUCKET=knotnex-private-prod,DATABASE_URL=postgresql://postgres:knotnex%402026@/knotnex_db?host=/cloudsql/$PROJECT_ID:asia-south1:knotnex-db,AUTO_RUN_MIGRATIONS=true'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
