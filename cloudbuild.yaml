steps:
  # 1. Build production container
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:$SHORT_SHA',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest',
      '.'
    ]

  # 2. Push to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api']

  # 3. Deploy to Cloud Run (5,000 CCU Spec)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'knotnex-backend',
      '--image', 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:$SHORT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--min-instances', '2',
      '--max-instances', '25',
      '--concurrency', '80',
      '--cpu', '2',
      '--memory', '2Gi',
      '--no-cpu-throttling',
      '--session-affinity',
      '--set-env-vars', 'AUTO_RUN_MIGRATIONS=true'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/knotnex/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
