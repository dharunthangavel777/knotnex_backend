name: KnotNex Backend CI/CD (Auto-Build & Deploy to GCP Cloud Run)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'knotnex-507306' }}
  REGION: asia-south1
  SERVICE_NAME: knotnex-backend
  GAR_REPOSITORY: knotnex
  IMAGE_NAME: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'knotnex-507306' }}/knotnex/api

jobs:
  build-and-deploy:
    name: Build, Run Migrations & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Authenticate to Google Cloud Platform
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 3. Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      - name: 4. Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: 5. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Build and Push Container Image to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Deploy to Google Cloud Run (High-Scale 5,000 CCU Spec)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 2 \
            --max-instances 25 \
            --concurrency 80 \
            --cpu 2 \
            --memory 2Gi \
            --no-cpu-throttling \
            --session-affinity \
            --set-env-vars AUTO_RUN_MIGRATIONS=true

      - name: 8. Verify Deployment Healthcheck
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Deployed successfully to: $SERVICE_URL"
          echo "Validating healthcheck..."
          curl -f "$SERVICE_URL/api/v1/health" || exit 1
          echo "Healthcheck passed! Node container and migrations verified."
