name: CI/CD - Build & Deploy KnotNex to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: lively-welder-512304-n4
  REGION: asia-south1
  GAR_LOCATION: asia-south1
  REPOSITORY: knotnex
  IMAGE: api
  SERVICE: knotnex-backend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Tag Docker Image
        run: |
          docker build \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest" \
            .

      - name: Push Image to Artifact Registry
        run: |
          docker push --all-tags "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"

      - name: Deploy to Cloud Run (Low-Cost High-Performance Spec)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform="managed" \
            --allow-unauthenticated \
            --service-account="knotnex-cloudrun-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances="${{ env.PROJECT_ID }}:${{ env.REGION }}:knotnex-db" \
            --port="8080" \
            --min-instances="0" \
            --max-instances="5" \
            --concurrency="40" \
            --cpu="1" \
            --memory="1Gi" \
            --set-env-vars="NODE_ENV=production,APP_ENV=production,GCS_PROJECT_ID=${{ env.PROJECT_ID }},GCS_MEDIA_BUCKET=knotnex-media-prod,GCS_PRIVATE_BUCKET=knotnex-private-prod,DATABASE_URL=postgresql://postgres:knotnex%402026@/knotnex_db?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:knotnex-db,AUTO_RUN_MIGRATIONS=true"
